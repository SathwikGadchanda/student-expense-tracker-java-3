<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#113e34"><title>Student Expense Tracker · Browser demo</title>
<style>
:root{color-scheme:light;font:100%/1.5 "Segoe UI",Arial,sans-serif;color:#173a30;background:#f4f7f3;--ink:#173a30;--green:#145540;--muted:#587063;--line:#d9e4da;--pale:#ebf3e9;--white:#fff}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #bb800b;outline-offset:3px}button{color:var(--green);border:1px solid var(--line);border-radius:9px;background:white;padding:.55rem .85rem;font-weight:600}button:hover{background:var(--pale)}button.primary{background:var(--green);color:#fff;border-color:var(--green)}button.primary:hover{background:#103e31}.layout{min-height:100vh;display:grid;grid-template-columns:215px minmax(0,1fr)}aside{background:#113e34;color:white;padding:2.2rem 1.1rem;display:flex;flex-direction:column;gap:2.5rem}.brand{display:flex;align-items:center;gap:.7rem;font-size:1.02rem;font-weight:700;line-height:1.2}.brand i{width:34px;height:34px;flex:none;background:linear-gradient(135deg,#d9e7a1 0 43%,transparent 44% 51%,#90c7a7 52% 100%);border-radius:8px}.brand small{font-size:.8rem;font-weight:500;display:block;margin-top:.15rem;color:#d2ead6}nav{display:grid;gap:.45rem}nav button{text-align:left;color:#d9e9df;background:transparent;border:0;padding:.7rem .9rem}nav button:hover,nav button[aria-current=page]{background:#285c49;color:#fff}aside footer{margin-top:auto;color:#c3d7ca;font-size:.87rem}main{width:100%;max-width:1510px;margin:0 auto;padding:clamp(1rem,3.3vw,3rem)}header,.section-head,.tools,.actions{display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap}header{margin-bottom:1.55rem}h1,h2,h3,p{margin:0}h1{font-size:clamp(1.9rem,3vw,3rem);font-weight:650;letter-spacing:-.055em;line-height:1.1}h2{font-size:1.25rem;letter-spacing:-.028em}h3{font-size:.95rem}header p,.note,.meta{color:var(--muted);font-size:.9rem}.tools{justify-content:flex-end}.tools input,input,select{border:1px solid #bdd0c1;border-radius:7px;color:var(--ink);padding:.55rem .65rem;background:#fff;min-width:0}.tools label{display:flex;align-items:center;gap:.5rem;font-size:.9rem}.cards{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:1rem;margin:1rem 0}.card,article{border:1px solid var(--line);border-radius:17px;background:#fff}.card{padding:1.25rem 1.5rem}.card b{display:block;font-size:clamp(1.55rem,2.9vw,2.65rem);letter-spacing:-.055em;font-variant-numeric:tabular-nums}.card small{display:block;color:var(--muted)}.card:first-child{background:#194b3c;color:#fff;border-color:#194b3c}.card:first-child small{color:#d1e3d5}.card h2{font-size:.95rem;font-weight:600;margin-bottom:.24rem}.row{display:grid;grid-template-columns:1.1fr 1fr;gap:1rem}.section-head{margin-bottom:.75rem}article{padding:clamp(1rem,2vw,1.5rem);min-width:0}.stack{display:grid;gap:1rem}.chart{display:grid;grid-template-columns:145px minmax(0,1fr);gap:1.1rem;align-items:center}.donut{width:140px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center}.donut div{border-radius:50%;background:white;width:74%;aspect-ratio:1;display:grid;place-content:center;text-align:center}.donut small{font-size:.78rem;color:var(--muted)}.donut strong{font-variant-numeric:tabular-nums;font-size:1.22rem}.legend{display:grid;gap:.35rem}.legend>div{display:flex;align-items:center;gap:.5rem;font-size:.88rem}.legend i{width:9px;height:9px;border-radius:50%;flex:none}.legend b{margin-left:auto;white-space:nowrap;font-variant-numeric:tabular-nums}.big{font-size:2.1rem;letter-spacing:-.05em;display:block}.bar{height:.65rem;border-radius:1rem;background:#e6ece3;margin:1rem 0 .55rem;overflow:hidden}.bar span{height:100%;display:block;background:#4e815c;border-radius:1rem}.warn{color:#8b540c}.over{color:#a23b34}.section-head .secondary{font-size:.88rem}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left}th{font-size:.8rem;color:var(--muted);font-weight:600;background:#f5f8f4}th,td{padding:.68rem .6rem;white-space:nowrap;border-bottom:1px solid #e7ede7}td{font-size:.92rem}.amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}.positive{color:#256947}.entry button{font-size:.86rem;padding:.26rem .55rem}td.desc{white-space:normal;min-width:150px}.controls{display:flex;gap:.7rem;flex-wrap:wrap;margin:1rem 0}.controls input{flex:1 1 180px}.empty{padding:1.4rem 0;color:var(--muted)}.budget-actions{margin-top:.8rem}.flag{font-size:.9rem;font-weight:600}.status{color:#315b45;min-height:1.5rem;margin:.5rem 0;font-size:.9rem}.status:empty{min-height:0;margin:0}dialog{color:var(--ink);border:1px solid var(--line);border-radius:15px;padding:1.6rem;max-width:min(31rem,calc(100% - 2rem));width:100%}dialog::backdrop{background:#102b23a6}dialog form{display:grid;gap:.85rem}dialog label{display:grid;gap:.25rem}dialog h2{font-size:1.55rem}.pair{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}.actions{justify-content:flex-end}.danger{color:#a23228;margin-right:auto}.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}.detail-grid article{padding:1.05rem}.detail-grid td,.detail-grid th{white-space:normal}.check{display:flex;align-items:center;gap:.35rem}
@media(max-width:1100px){.layout{grid-template-columns:170px minmax(0,1fr)}aside{padding:1.6rem .85rem}.chart{grid-template-columns:110px minmax(0,1fr)}.donut{width:108px}.row{grid-template-columns:1.2fr 1fr}.detail-grid{grid-template-columns:1fr 1fr}}
@media(max-width:800px){.layout{display:block}aside{gap:1rem;padding:1rem 1.2rem}.brand small{display:inline;margin-left:.4rem}nav{display:flex;flex-wrap:wrap;gap:.2rem}nav button{padding:.4rem .67rem}aside footer{display:none}.row{grid-template-columns:1fr}.chart{grid-template-columns:140px minmax(0,1fr)}.donut{width:135px}header{align-items:flex-start}.tools{justify-content:flex-start}.card{padding:1rem}.cards{gap:.5rem}.detail-grid{grid-template-columns:1fr}}
@media(max-width:520px){header{gap:1rem}.tools{width:100%;justify-content:space-between}.tools label{display:grid;gap:0}.cards{grid-template-columns:1fr 1fr}.card:first-child{grid-column:1/-1}.card:first-child b{font-size:2.45rem}.card h2{font-size:.9rem}.chart{grid-template-columns:90px minmax(0,1fr);gap:.7rem}.donut{width:90px}.donut strong{font-size:.88rem}.donut small{font-size:.68rem}.legend>div{font-size:.82rem}.pair{grid-template-columns:1fr}.big{font-size:1.75rem}}
</style>
</head>
<body><div class="layout"><aside><div class="brand"><i aria-hidden="true"></i><span>Student Expense<small>Tracker</small></span></div><nav aria-label="Main navigation"><button data-page="Overview" aria-current="page">Overview</button><button data-page="Transactions">Transactions</button><button data-page="Budgets">Budgets</button><button data-page="Reports">Reports</button></nav><footer>Student Expense Tracker<br>Interactive browser demo</footer></aside>
<main><header><div><h1 id="page-title">Overview</h1><p>Browser demo · Fictional starting data · Saved on this browser</p></div><div class="tools"><label>Report month <input type="month" id="month" required></label><button class="primary" data-act="add">+ Add transaction</button></div></header><p id="status" class="status" role="status"></p><div class="stack" id="view"></div></main></div>
<dialog id="entry"><form id="entry-form"><h2 id="entry-title">Add transaction</h2><div class="pair"><label>Type<select id="kind"><option>Expense</option><option>Income</option></select></label><label>Category<select id="category"></select></label></div><div class="pair"><label>Amount in INR<input id="amount" required type="text" inputmode="decimal" placeholder="120.50" maxlength="12"></label><label>Date<input id="date" required type="date"></label></div><label>Description <input id="description" placeholder="e.g. Canteen lunch" maxlength="250"></label><div class="actions"><button type="button" id="remove" class="danger">Delete</button><button type="button" data-act="close">Cancel</button><button class="primary">Save transaction</button></div></form></dialog>
<dialog id="limit"><form id="limit-form"><h2>Monthly budget</h2><p class="note" id="limit-month"></p><label>Spending limit in INR<input id="limit-amount" required type="text" inputmode="decimal" placeholder="3500.00" maxlength="12"></label><div class="actions"><button type="button" data-act="close">Cancel</button><button class="primary">Save budget</button></div></form></dialog>
<dialog id="confirm-delete"><form id="delete-form"><h2>Delete this transaction?</h2><p class="note" id="delete-detail"></p><div class="actions"><button type="button" data-act="close">Keep transaction</button><button class="primary">Delete transaction</button></div></form></dialog>
<script src="app.js" defer></script></body></html>
